<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传管理器</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fab fa-github"></i>
                <span>GitHub上传模拟器</span>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link active"><i class="fas fa-upload"></i> 上传</a>
                <a href="#" class="nav-link"><i class="fas fa-history"></i> 历史</a>
                <a href="#" class="nav-link"><i class="fas fa-cog"></i> 设置</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="upload-container">
            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <h2 class="upload-title">选择图片上传</h2>
                    <p class="upload-subtitle">支持 JPG、PNG、GIF 格式，单个文件最大 25MB</div>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                    <button class="upload-btn" id="uploadBtn">
                        <i class="fas fa-folder-open"></i>
                        选择文件
                    </button>
                </div>
            </div>

            <!-- 文件预览区域 -->
            <div class="preview-container" id="previewContainer" style="display: none;">
                <h3 class="preview-title">已选择文件</h3>
                <div class="preview-grid" id="previewGrid"></div>
                
                <!-- 上传设置 -->
                <div class="upload-settings">
                    <div class="setting-group">
                        <label for="targetDir" class="setting-label">
                            <i class="fas fa-folder"></i>
                            目标目录
                        </label>
                        <input type="text" id="targetDir" class="setting-input" value="images/" placeholder="输入目标目录路径">
                    </div>
                    
                    <div class="setting-group">
                        <label for="commitMsg" class="setting-label">
                            <i class="fas fa-comment"></i>
                            提交信息
                        </label>
                        <input type="text" id="commitMsg" class="setting-input" placeholder="输入提交描述">
                    </div>

                    <div class="action-buttons">
                        <button class="btn-secondary" id="cancelBtn">
                            <i class="fas fa-times"></i>
                            取消
                        </button>
                        <button class="btn-primary" id="confirmUploadBtn">
                            <i class="fas fa-paper-plane"></i>
                            确认上传
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 上传历史 -->
        <div class="history-container" id="historyContainer">
            <h3 class="history-title">
                <i class="fas fa-clock"></i>
                上传历史
            </h3>
            <div class="history-list" id="historyList"></div>
        </div>
    </main>

    <!-- 上传进度模态框 -->
    <div class="modal" id="progressModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>上传进度</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                <div class="progress-text" id="progressText">准备上传...</div>
            </div>
        </div>
    </div>

    <!-- 成功提示 -->
    <div class="toast success" id="successToast" style="display: none;">
                    <i class="fas fa-check-circle"></i>
                    <span>文件上传成功！</span>
                </div>
            </div>

    <script src="script.js"></script>
</body>
</html>
