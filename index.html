<!DOCTYPE html>
<html>
<body>
  <input type="file" id="fileInput" />
  <button onclick="uploadToGitHub()">上传到 GitHub</button>

  <script>
    // 配置信息（替换为你的实际信息）
    const CONFIG = {
      token: "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", // 你的 GitHub PAT（需有 repo 权限）
      owner: "shaoyiheng",   // 仓库所有者（用户名或组织名）
      repo: "shaoyiheng.github.io",          // 仓库名
      branch: "dev",                  // 目标分支
      path: "uploads/",                // 文件在仓库中的保存路径（如 uploads/xxx.png）
    };

    async function uploadToGitHub() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) {
        alert("请选择文件！");
        return;
      }

      try {
        // 1. 读取文件并转为 Base64
        const base64Content = await readFileAsBase64(file);
        // 2. 拼接文件在 GitHub 中的完整路径（保留原文件名）
        const githubFilePath = `${CONFIG.path}${file.name}`;
        // 3. 调用 GitHub API 提交文件
        const response = await fetch(
          `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${githubFilePath}`,
          {
            method: "PUT",
            headers: {
              Authorization: `token ${CONFIG.token}`,
              "Content-Type": "application/json",
              Accept: "application/vnd.github.v3+json", // 指定 GitHub API 版本
            },
            body: JSON.stringify({
              message: `Upload file: ${file.name}`, // 提交信息
              content: base64Content,               // Base64 编码的文件内容
              branch: CONFIG.branch,                // 目标分支
              // 可选：如果文件已存在，需指定 SHA（否则会覆盖，或通过 GET 请求获取旧 SHA）
              // sha: "旧文件的 SHA 值"（首次上传可省略）
            }),
          }
        );

        const result = await response.json();
        if (response.ok) {
          alert(`上传成功！文件地址：${result.content.html_url}`);
        } else {
          alert(`上传失败：${result.message}`);
        }
      } catch (error) {
        console.error("上传异常：", error);
        alert("上传失败，请检查控制台日志！");
      }
    }

    // 辅助函数：将文件转为 Base64
    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          // 去除 Base64 前缀（如 "data:image/png;base64,"），仅保留编码部分
          const base64 = e.target.result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file); // 以 DataURL 格式读取（包含 Base64）
      });
    }
  </script>
</body>
</html>
